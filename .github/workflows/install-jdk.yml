name: Install latest non-LTS JDK

# Installs the newest non-LTS Temurin JDK that matches the runner's own OS and architecture, using
# this repository's jdk_versions.py (--auto detects the host, --download fetches and verifies the
# archive), then checks that it runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-jdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-jdk:
    name: Install JDK (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One runner for each OS and architecture that has a non-LTS Temurin build. The
        # macos-15-intel and windows-11-arm runners are left out because Adoptium publishes no
        # macOS x64 or Windows aarch64 build of the current non-LTS release.
        runner:
          - ubuntu-latest        # linux x64
          - ubuntu-24.04-arm     # linux aarch64
          - macos-latest         # macOS aarch64 (Apple Silicon)
          - windows-latest       # windows x64
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to commit SHAs. Dependabot keeps them current (see dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      # --auto picks this runner's OS and architecture. --download saves the file and checks it
      # against its published SHA-256 checksum, and the step fails if the download or the check
      # fails. The directory starts empty, so the one file in it afterwards is the archive.
      - name: Download and verify the latest non-LTS JDK for this machine
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="$RUNNER_TEMP/jdk-download"
          if command -v cygpath >/dev/null; then DOWNLOAD_DIR=$(cygpath -m "$RUNNER_TEMP")/jdk-download; fi
          python jdk_versions.py --auto --non-lts --count 1 --download --target-directory "$DOWNLOAD_DIR"
          set -- "$DOWNLOAD_DIR"/*
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected exactly one downloaded file in $DOWNLOAD_DIR" >&2; exit 1; }
          echo "ARCHIVE=$1" >> "$GITHUB_ENV"
          echo "Downloaded $1"

      - name: Install the JDK
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/jdk"
          if command -v cygpath >/dev/null; then DEST=$(cygpath -m "$RUNNER_TEMP")/jdk; fi
          mkdir -p "$DEST"
          case "$ARCHIVE" in
            *.zip)    python -m zipfile -e "$ARCHIVE" "$DEST" ;;
            *.tar.gz) tar -xzf "$ARCHIVE" -C "$DEST" ;;
            *) echo "unexpected archive type: $ARCHIVE" >&2; exit 1 ;;
          esac
          # The archive holds one directory. On macOS the JDK is in Contents/Home inside it.
          TOP=$(echo "$DEST"/*/)
          if [ -d "${TOP}Contents/Home" ]; then JAVA_HOME_DIR="${TOP}Contents/Home"; else JAVA_HOME_DIR="$TOP"; fi
          JAVA_HOME_DIR=$(cd "$JAVA_HOME_DIR" && pwd)
          if command -v cygpath >/dev/null; then JAVA_HOME_DIR=$(cygpath -w "$JAVA_HOME_DIR"); fi
          echo "JAVA_HOME=$JAVA_HOME_DIR" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_DIR/bin" >> "$GITHUB_PATH"
          echo "Installed to $JAVA_HOME_DIR"

      - name: Check the installed JDK
        run: |
          set -euo pipefail
          EXPECTED_MAJOR=$(python jdk_versions.py --auto --non-lts --version-only)
          java -version
          javac -version
          # "java -version" reports the major version, such as "27.0.1", on the first line.
          java -version 2>&1 | head -n 1 | grep -E "\"?${EXPECTED_MAJOR}[.\" ]" \
            || { echo "java does not report major version $EXPECTED_MAJOR" >&2; exit 1; }
