name: Install latest non-LTS JDK

# Installs the newest non-LTS Temurin JDK that matches the runner's own OS and architecture, using
# this repository's jdk_versions.py (--auto detects the host, --install implies --download and
# fetches, verifies and unpacks the archive in one step), then checks that it runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-jdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-jdk:
    name: Install JDK (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One runner for each OS and architecture that has a non-LTS Temurin build. The
        # macos-15-intel and windows-11-arm runners are left out because Adoptium publishes no
        # macOS x64 or Windows aarch64 build of the current non-LTS release.
        runner:
          - ubuntu-latest        # linux x64
          - ubuntu-24.04-arm     # linux aarch64
          - macos-latest         # macOS aarch64 (Apple Silicon)
          - windows-latest       # windows x64
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to commit SHAs. Dependabot keeps them current (see dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      # --auto picks this runner's OS and architecture. --install implies --download (fetches and
      # verifies the archive against its published SHA-256 checksum) and then unpacks it into
      # --install-dir/<install-prefix><major>. We resolve the install path from the major version
      # returned by --version-only so we never have to parse stderr output.
      - name: Download, verify and install the latest non-LTS JDK for this machine
        run: |
          set -euo pipefail
          DOWNLOAD_DIR="$RUNNER_TEMP/jdk-download"
          PREFIX_DIR="$RUNNER_TEMP/jdk-install"
          if command -v cygpath >/dev/null; then
            DOWNLOAD_DIR=$(cygpath -m "$RUNNER_TEMP")/jdk-download
            PREFIX_DIR=$(cygpath -m "$RUNNER_TEMP")/jdk-install
          fi
          MAJOR=$(python jdk_versions.py --auto --non-lts --version-only)
          python jdk_versions.py --auto --non-lts --count 1 \
            --install --target-directory "$DOWNLOAD_DIR" \
            --install-dir "$PREFIX_DIR" --install-prefix jdk
          JAVA_HOME_DIR=$(cd "$PREFIX_DIR/jdk$MAJOR" && pwd)
          if command -v cygpath >/dev/null; then JAVA_HOME_DIR=$(cygpath -w "$JAVA_HOME_DIR"); fi
          echo "JAVA_HOME=$JAVA_HOME_DIR" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_DIR/bin" >> "$GITHUB_PATH"

      - name: Check the installed JDK
        run: |
          set -euo pipefail
          EXPECTED_MAJOR=$(python jdk_versions.py --auto --non-lts --version-only)
          java -version
          javac -version
          # "java -version" reports the major version, such as "27.0.1", on the first line.
          java -version 2>&1 | head -n 1 | grep -E "\"?${EXPECTED_MAJOR}[.\" ]" \
            || { echo "java does not report major version $EXPECTED_MAJOR" >&2; exit 1; }
